name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: safety
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: safety_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U safety -d safety_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: safety
      DB_PASSWORD: synthetic-ci-only
      DB_NAME: safety_test
      ALLOW_DATABASE_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:postgres
